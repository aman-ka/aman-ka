name: Generate Snake Animation

on:
  # Run automatically every 24 hours at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Run on every push to main branch
  push:
    branches: [ main ]
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v3
      
      # Generate the snake animation
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: aman-ka
          outputs: |
            dist/github-contribution-grid-snake.svg?delay=300&color_snake=#00ff88&background_color=#0d1117&animation_duration=10
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&delay=300&glow_effect=true&animation_duration=10
            dist/github-contribution-grid-snake-neon.gif?color_snake=linear-gradient(45deg,%2300ff88,%2300ccff)&color_dots=#e3f2fd,#bbdefb,#90caf9,#64b5f6,#42a5f5&delay=300&background_color=#0d1117&animation_duration=10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Show files generated (for debugging)
      - name: Show the status of the repository
        run: git status
      
      # Push the generated files to the output branch
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
